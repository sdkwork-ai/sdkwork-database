[package]
name = "sdkwork-database-lifecycle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SDKWork database lifecycle orchestration: migrate, seed, bootstrap"

[features]
default = ["postgres"]
postgres = [
    "sqlx/postgres",
    "sdkwork_database_sqlx/postgres",
    "sdkwork_database_history/postgres",
]
sqlite = [
    "sqlx/sqlite",
    "sdkwork_database_sqlx/sqlite",
    "sdkwork_database_history/sqlite",
]

[dependencies]
sdkwork_database_config.workspace = true
sdkwork_database_history.workspace = true
sdkwork_database_sqlx.workspace = true
sdkwork_database_spi.workspace = true

async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
sqlx.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
url.workspace = true
sdkwork_database_config.workspace = true
sdkwork_database_sqlx.workspace = true

[[test]]
name = "migrate_seed_smoke"
path = "tests/migrate_seed_smoke.rs"
required-features = ["sqlite"]

[[test]]
name = "installation_state_machine"
path = "tests/installation_state_machine.rs"
required-features = ["sqlite"]

[[test]]
name = "checksum_immutability"
path = "tests/checksum_immutability.rs"
required-features = ["sqlite"]

[[test]]
name = "registry_orchestrator"
path = "tests/registry_orchestrator.rs"
required-features = ["sqlite"]

[[test]]
name = "postgres_restart_state"
path = "tests/postgres_restart_state.rs"
required-features = ["postgres"]
