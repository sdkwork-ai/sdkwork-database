[package]
name = "sdkwork-database-repository"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified repository pattern abstraction for SDKWork database operations"


[lints]
workspace = true
[features]
default = ["postgres"]
postgres = [
    "sqlx/postgres",
    "sdkwork_database_sqlx/postgres",
    "sdkwork-database-id/postgres",
]
sqlite = [
    "postgres",
    "sqlx/sqlite",
    "sdkwork_database_sqlx/sqlite",
    "sdkwork-database-id/sqlite",
]

[dependencies]
sdkwork_database_config.workspace = true
sdkwork_database_sqlx.workspace = true
sdkwork-database-id = { workspace = true, default-features = false }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Database
sqlx.workspace = true

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
chrono = { workspace = true }
uuid = { workspace = true }
paste = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
