[package]
name = "sdkwork-database-ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SDKWork database ops read models for status, drift, migrations, and seeds"


[lints]
workspace = true
[features]
default = ["postgres"]
postgres = ["sdkwork_database_drift/postgres"]
sqlite = ["postgres", "sdkwork_database_drift/sqlite"]

[dependencies]
sdkwork_database_drift.workspace = true
sdkwork_database_history.workspace = true
sdkwork_database_lifecycle.workspace = true
sdkwork_database_spi.workspace = true
sdkwork_database_sqlx.workspace = true

chrono.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
sdkwork_database_config.workspace = true

[[test]]
name = "ops_smoke"
# SQLite-backed ops smoke test; skipped unless the sqlite feature is enabled.
required-features = ["sqlite"]
