[package]
name = "sdkwork-database-drift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SDKWork database schema drift detection"

[features]
default = ["postgres"]
postgres = [
    "sqlx/postgres",
    "sdkwork_database_sqlx/postgres",
    "sdkwork_database_history/postgres",
    "sdkwork_database_lifecycle/postgres",
]
sqlite = [
    "postgres",
    "sqlx/sqlite",
    "sdkwork_database_sqlx/sqlite",
    "sdkwork_database_history/sqlite",
    "sdkwork_database_lifecycle/sqlite",
]

[dependencies]
sdkwork_database_config.workspace = true
sdkwork_database_contract.workspace = true
sdkwork_database_history.workspace = true
sdkwork_database_sqlx.workspace = true
sdkwork_database_spi.workspace = true

async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
url.workspace = true
sdkwork_database_config.workspace = true
sdkwork_database_lifecycle.workspace = true
sdkwork_database_sqlx.workspace = true
sdkwork_database_spi.workspace = true

[[test]]
name = "constraint_drift"
# SQLite-backed drift detection; skipped unless the sqlite feature is enabled.
required-features = ["sqlite"]

[[test]]
name = "drift_smoke"
# SQLite-backed drift smoke test; skipped unless the sqlite feature is enabled.
required-features = ["sqlite"]

[[test]]
name = "nullability_drift"
# SQLite-backed nullability drift detection; skipped unless sqlite is enabled.
required-features = ["sqlite"]

[[test]]
name = "sqlite_metadata_drift"
# SQLite metadata drift detection; skipped unless sqlite is enabled.
required-features = ["sqlite"]
