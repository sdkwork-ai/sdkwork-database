[package]
name = "sdkwork-database-id"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Database-backed Snowflake node_id allocation and unified ID generation for SDKWork services."


[lints]
workspace = true
[features]
default = ["postgres"]
postgres = ["sqlx/postgres", "sdkwork_database_sqlx/postgres"]
sqlite = ["sqlx/sqlite", "sdkwork_database_sqlx/sqlite"]

[lib]
name = "sdkwork_database_id"
path = "src/lib.rs"

[dependencies]
sdkwork-id-core = { workspace = true }
sdkwork_database_config.workspace = true
sdkwork_database_sqlx.workspace = true

# Async runtime
tokio = { workspace = true }

# Database
sqlx.workspace = true

# Logging
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
