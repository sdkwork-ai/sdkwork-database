[workspace]
members = [
    "crates/sdkwork-database-config",
    "crates/sdkwork-database-sqlx",
    "crates/sdkwork-database-repository",
    "crates/sdkwork-database-spi",
    "crates/sdkwork-database-history",
    "crates/sdkwork-database-contract",
    "crates/sdkwork-database-lifecycle",
    "crates/sdkwork-database-drift",
    "crates/sdkwork-database-ops",
    "crates/sdkwork-database-ops-http",
    "crates/sdkwork-database-id",
    "crates/sdkwork-database-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-or-later"
repository = "https://github.com/sdkwork/sdkwork-database"

[workspace.lints.rust]
# RUST_CODE_SPEC.md section 13 baseline.
# Deny-tier lints (unsafe_code, panic, unwrap_used, expect_used, pedantic) are
# promoted per crate together with their cleanup: enabling them fleet-wide
# today floods or fails builds that have not paid that debt yet.
unsafe_op_in_unsafe_fn = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"

[workspace.dependencies]
sdkwork_database_ops = { path = "crates/sdkwork-database-ops", package = "sdkwork-database-ops" }

sdkwork_database_history = { path = "crates/sdkwork-database-history", package = "sdkwork-database-history" }

sdkwork_database_contract = { path = "crates/sdkwork-database-contract", package = "sdkwork-database-contract" }

sdkwork_database_sqlx = { path = "crates/sdkwork-database-sqlx", package = "sdkwork-database-sqlx" }

sdkwork_database_spi = { path = "crates/sdkwork-database-spi", package = "sdkwork-database-spi" }

sdkwork_database_lifecycle = { path = "crates/sdkwork-database-lifecycle", package = "sdkwork-database-lifecycle" }

sdkwork_database_drift = { path = "crates/sdkwork-database-drift", package = "sdkwork-database-drift" }

sdkwork_database_config = { path = "crates/sdkwork-database-config", package = "sdkwork-database-config" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Database
# sqlx 0.9 aligns with the kernel Codex graph (rusqlite 0.39 -> libsqlite3-sys 0.37);
# sqlx-sqlite 0.9 accepts libsqlite3-sys >=0.30.1,<0.38, so the graph unifies at 0.37.0.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls"] }
libsqlite3-sys = ">=0.30.1, <0.38"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
paste = "1"
sha2 = "0.10"
hex = "0.4"
tower = "0.5"
url = "2"

# Testing
tempfile = "3"
assert_matches = "1"

# ID generation
sdkwork-database-id = { path = "crates/sdkwork-database-id", default-features = false }
sdkwork-id-core = { path = "../sdkwork-id/crates/sdkwork-id-core" }
